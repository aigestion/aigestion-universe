# Lefthook Configuration - Fast Git Hooks
# Run: lefthook install

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check --force-exclude {staged_files}
      stage_fixed: true
    # ruff-format retirado del pre-commit (2026-10-09): el repo tiene deuda
    # de formato pre-existente (44/53 ficheros modificados la tienen) y el
    # gate documentado es `ruff check` (ratchet), no `ruff format`.
    pytest-unit:
      glob: "tests/**/*.py"
      shell: bash
      # Sin comillas dobles internas: lefthook envuelve el script en "..." y
      # cualquier " interior parte el comando (viajo -m como solo "not").
      # Escribe el fichero por defecto que lee check_gate.py (mismo flujo
      # que el full-test de pre-push; cada hook sobrescribe y valida al instante).
      run: |
        uv run pytest tests/ -q --tb=no -p no:cacheprovider -m 'not network and not android and not integration' --ignore=tests/mobile --ignore=tests/agents --ignore=tests/daniela --ignore=tests/gev --ignore=tests/initiative --ignore=tests/integration --ignore=tests/iot --ignore=tests/load --ignore=tests/security --ignore=tests/swarm > $TEMP/pytest-20261004.txt 2>&1 || true
        uv run python scripts/check_gate.py
    ktlint:
      glob: "*.kt"
      shell: bash
      run: |
        if [ -f frontend/apps/daniela-os/android-app/gradlew ]; then
          cd frontend/apps/daniela-os/android-app && ./gradlew ktlintCheck --daemon
        else
          echo [skip] gradlew no esta trackeado en este repo legacy
        fi
    detekt:
      glob: "*.kt"
      shell: bash
      run: |
        if [ -f frontend/apps/daniela-os/android-app/gradlew ]; then
          cd frontend/apps/daniela-os/android-app && ./gradlew detekt --daemon
        else
          echo [skip] gradlew no esta trackeado en este repo legacy
        fi
    secrets:
      run: echo "gitleaks not installed, skipping"

pre-push:
  parallel: false
  commands:
    full-test:
      shell: bash
      # Sin comillas dobles internas (mismo motivo que pytest-unit).
      run: |
        uv run pytest tests/ -m 'not network and not android and not integration' -q --tb=no -p no:cacheprovider --continue-on-collection-errors > $TEMP/pytest-20261004.txt 2>&1 || true
        uv run python scripts/check_gate.py
    ruff-ratchet:
      run: python scripts/utils/ratchet_ruff.py
    android-lint:
      shell: bash
      run: |
        if [ -f frontend/apps/daniela-os/android-app/gradlew ]; then
          cd frontend/apps/daniela-os/android-app && ./gradlew lintDebug --daemon
        else
          echo [skip] gradlew no esta trackeado en este repo legacy wrapper ausente y no hay Android SDK en esta maquina - Android lint corre desde el toolchain canonico aigestion-universe
        fi

commit-msg:
  commands:
    commitlint:
      run: npx --yes @commitlint/cli --edit {1}

# Skip hooks for specific patterns
skip:
  - "docs/**"
  - "*.md"
  - "*.txt"
  - ".gitignore"
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - "*.toml"