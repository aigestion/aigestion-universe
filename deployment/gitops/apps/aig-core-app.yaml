apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aig-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aig
  source:
    repoURL: https://github.com/aig/aig.git
    targetRevision: HEAD
    path: config/gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: aig
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas