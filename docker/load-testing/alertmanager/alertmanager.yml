global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@aig.local'

route:
  group_by: ['alertname', 'job', 'engine']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: 'critical'
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 1h
    - match:
        severity: 'warning'
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@aig.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@aig.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook/critical'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@aig.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook/warning'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'engine']