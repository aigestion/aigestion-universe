version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: aig-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=aig
      - DOCKER_INFLUXDB_INIT_BUCKET=k6
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-admin-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - influxdb-config:/etc/influxdb2
    networks:
      - loadtest-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    container_name: aig-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - loadtest-net
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  k6-runner:
    build:
      context: .
      dockerfile: Dockerfile.k6
    container_name: aig-k6
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_PORT=5665
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts/k6:ro
      - ./k6/reports:/scripts/k6/reports
    networks:
      - loadtest-net
    depends_on:
      influxdb:
        condition: service_healthy
    command: >
      sh -c "sleep 10 && k6 run --out influxdb=http://influxdb:8086/k6 /scripts/k6/load.js"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  locust-master:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: aig-locust-master
    environment:
      - LOCUST_MODE=master
      - LOCUST_WEB_HOST=0.0.0.0
      - LOCUST_WEB_PORT=8089
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./locust:/locust:ro
      - ./locust/reports:/locust/reports
    networks:
      - loadtest-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  locust-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: aig-locust-worker-1
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - LOCUST_MASTER_PORT=5557
    volumes:
      - ./locust:/locust:ro
    networks:
      - loadtest-net
    depends_on:
      - locust-master
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  locust-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: aig-locust-worker-2
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - LOCUST_MASTER_PORT=5557
    volumes:
      - ./locust:/locust:ro
    networks:
      - loadtest-net
    depends_on:
      - locust-master
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  locust-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: aig-locust-worker-3
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - LOCUST_MASTER_PORT=5557
    volumes:
      - ./locust:/locust:ro
    networks:
      - loadtest-net
    depends_on:
      - locust-master
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  locust-worker-4:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: aig-locust-worker-4
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - LOCUST_MASTER_PORT=5557
    volumes:
      - ./locust:/locust:ro
    networks:
      - loadtest-net
    depends_on:
      - locust-master
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aig-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - loadtest-net

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: aig-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - loadtest-net

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  prometheus-data:
  alertmanager-data:

networks:
  loadtest-net:
    driver: bridge