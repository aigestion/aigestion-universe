[project]
name = "daniela-obsidian"
version = "0.1.0"
description = "Two-way Obsidian vault sync for Daniela OS memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "pydantic>=2.7.0",
    "watchfiles>=0.21.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daniela_obsidian"]
