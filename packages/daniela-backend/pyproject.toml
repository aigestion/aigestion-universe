[project]
name = "daniela-backend"
version = "0.1.0"
description = "Daniela OS - Backend Services"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "daniela-engines",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-engines = {path = "../daniela-engines", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "backend",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "daniela_backend.multi-region.dns_sim",
    "daniela_backend.multi-region.failover",
    "daniela_backend.multi-region.failover_drill",
    "daniela_backend.multi-region.health_mesh",
    "daniela_backend.multi-region.load_balancer",
    "daniela_backend.multi-region.replication",
    "daniela_backend.multi-region.server",
    "daniela_backend.perf_tuning.rightsize",
]
ignore_errors = true
