[project]
name = "daniela-sdk"
version = "0.1.0"
description = "Official Python SDK for Daniela OS (aigestion.net)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daniela_sdk"]
