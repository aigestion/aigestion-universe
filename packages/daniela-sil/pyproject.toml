[project]
name = "daniela-sil"
version = "0.1.0"
description = "Daniela OS - SIL (Software-in-the-Loop) Testing"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "daniela-engines",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-engines = {path = "../daniela-engines", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_sil"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "sil",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "daniela_sil.sil_engine",
]
ignore_errors = true
