[project]
name = "daniela-tenants"
version = "0.1.0"
description = "Daniela OS - Multi-tenant Data and Storage"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_tenants"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "storage",
    "data",
    "tenants",
]
per-file-ignores = { "src/daniela_tenants/data_engine/__init__.py" = ["F403"], "src/daniela_tenants/data_engine/server.py" = ["F841"], "src/daniela_tenants/data_engine/storage.py" = ["E402"] }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "daniela_tenants.data_engine.analytics",
    "daniela_tenants.data_engine.pipeline",
    "daniela_tenants.data_engine.reports",
    "daniela_tenants.data_engine.storage",
    "daniela_tenants.data_engine.visualization",
]
ignore_errors = true
