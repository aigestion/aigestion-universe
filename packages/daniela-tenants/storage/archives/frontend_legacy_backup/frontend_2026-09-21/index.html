<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DANIELA OS // MUSE AI INTEGRATION 14.0</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(10, 15, 30, 0.92);
      --primary: #00f3ff;
      --secondary: #ff007f;
      --muse-color: #a855f7;
      --green: #00ff66;
      --border: rgba(0, 243, 255, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
    body { background-color: var(--bg); color: #fff; padding: 8px; padding-bottom: 85px; overflow-x: hidden; user-select: none; }

    .top-nav {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 12px; margin-bottom: 8px;
    }
    .brand { font-weight: bold; font-size: 0.85rem; color: var(--primary); text-shadow: 0 0 8px var(--primary); }
    .status-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; background: rgba(168, 85, 247, 0.2); border: 1px solid var(--muse-color); color: var(--muse-color); }

    #graph-3d-viewport {
      width: 100%; height: 230px; border-radius: 16px;
      background: radial-gradient(circle, rgba(15,23,42,0.95) 0%, rgba(3,7,18,1) 100%);
      border: 1px solid var(--border); box-shadow: 0 0 25px rgba(0,243,255,0.25);
      position: relative; overflow: hidden; margin-bottom: 8px;
    }

    .actions-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .btn-act {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 4px; font-size: 0.6rem; font-weight: bold; color: var(--primary);
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .btn-act:active { background: var(--primary); color: #000; }
    .btn-muse { border-color: var(--muse-color); color: var(--muse-color); }
    .btn-muse:active { background: var(--muse-color); color: #fff; box-shadow: 0 0 12px var(--muse-color); }

    .console-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .console-log { height: 80px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px; font-size: 0.65rem; color: var(--green); overflow-y: auto; margin-bottom: 8px; }
    .input-box { display: flex; gap: 6px; }
    .cmd-input { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 8px; color: #fff; font-size: 0.8rem; outline: none; }
    .btn-send { background: var(--primary); border: none; border-radius: 6px; padding: 0 12px; color: #000; font-weight: bold; font-size: 0.75rem; cursor: pointer; }

    .floating-dock {
      position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 100;
      background: rgba(3, 7, 18, 0.95); border: 1px solid var(--primary);
      border-radius: 14px; padding: 8px; backdrop-filter: blur(16px); display: flex; gap: 8px;
    }
    .btn-wake {
      flex: 1; background: linear-gradient(135deg, var(--primary), var(--muse-color));
      border: none; border-radius: 8px; padding: 12px; color: #000; font-weight: bold; font-size: 0.85rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="brand">⚡ DANIELA OS // MUSE AI MODULE</div>
    <div class="status-badge" id="agent-status">MUSE AGENT READY</div>
  </div>

  <div id="graph-3d-viewport"></div>

  <div class="actions-grid">
    <div class="btn-act btn-muse" onclick="sendMuseCmd('Genera una idea creativa')">🎨 MUSE AI</div>
    <div class="btn-act" onclick="execCmdInput('Sincronizar telemetria')">🔄 TELEMETRÍA</div>
    <div class="btn-act" onclick="execCmdInput('Enciende la linterna')">💡 LINTERNA</div>
  </div>

  <div class="console-wrapper">
    <div class="console-log" id="sys-log">
      > Agente Muse AI conectado al orquestador.<br>
      > Di "Oye Daniela dile a Muse que..." o pulsa el botón de Muse AI.
    </div>
    <div class="input-box">
      <input type="text" id="cmd-input" class="cmd-input" placeholder="Comando a Daniela o Muse..." onkeypress="if(event.key==='Enter') execCmd()">
      <button class="btn-send" onclick="execCmd()">ENVIAR</button>
    </div>
  </div>

  <div class="floating-dock">
    <button class="btn-wake" id="wake-btn" onclick="toggleVoice()">🎙️ ACTIVAR "OYE DANIELA"</button>
  </div>

  <script>
    let coreMesh, museMesh;

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
      }
    }

    async function sendMuseCmd(promptText) {
      const log = document.getElementById('sys-log');
      log.innerHTML += `<br><span style="color:var(--muse-color)">> Delegando a Muse AI: ${promptText}</span>`;
      
      if (museMesh) museMesh.material.color.setHex(0xa855f7);

      try {
        const response = await fetch('/api/muse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await response.json();
        log.innerHTML += `<br><span style="color:var(--green)">> Muse AI: ${data.response}</span>`;
        speakText(data.response);
      } catch (err) {
        log.innerHTML += `<br><span style="color:red">> Error en el conector Muse AI.</span>`;
      }
      log.scrollTop = log.scrollHeight;
    }

    function execCmdInput(text) {
      document.getElementById('cmd-input').value = text;
      execCmd();
    }

    async function execCmd() {
      const input = document.getElementById('cmd-input');
      const log = document.getElementById('sys-log');
      const text = input.value.trim();
      if (!text) return;

      if (text.toLowerCase().includes('muse')) {
        sendMuseCmd(text);
      } else {
        log.innerHTML += `<br><span style="color:var(--primary)">> Orden: ${text}</span>`;
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          log.innerHTML += `<br><span style="color:var(--green)">> Daniela: ${data.response}</span>`;
          speakText(data.response);
        } catch (e) {}
      }
      input.value = '';
      log.scrollTop = log.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("graph-3d-viewport");
      if (!container || typeof THREE === "undefined") return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 6.0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const coreGeo = new THREE.IcosahedronGeometry(0.8, 1);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
      coreMesh = new THREE.Mesh(coreGeo, coreMat);
      scene.add(coreMesh);

      const museGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const museMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true });
      museMesh = new THREE.Mesh(museGeo, museMat);
      museMesh.position.set(1.8, 0.8, 0);
      scene.add(museMesh);

      function animate() {
        requestAnimationFrame(animate);
        coreMesh.rotation.x += 0.005;
        coreMesh.rotation.y += 0.008;

        const time = Date.now() * 0.0015;
        museMesh.position.x = Math.cos(time) * 1.8;
        museMesh.position.z = Math.sin(time) * 1.8;

        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
