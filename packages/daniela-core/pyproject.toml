[project]
name = "daniela_core"
version = "0.1.0"
description = "Daniela OS Core - Autonomous AI Service Management & Edge Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "websockets>=12.0",
    "aiofiles>=23.2.0",
    "watchfiles>=0.21.0",
    "tenacity>=8.2.0",
    "croniter>=2.0.0",
    "apscheduler>=3.10.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
ml = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "llama-cpp-python>=0.2.90",
]
embodiment = [
    # NOTE: rclpy / ros2-control are ROS packages (apt: ros-humble-rclpy),
    # not on PyPI - install separately. Listed here would break uv lock.
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
]
full = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "llama-cpp-python>=0.2.90",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
]

[project.urls]
Homepage = "https://aigestion.net"
Repository = "https://github.com/aigestion/aigestion-core"
Documentation = "https://docs.aigestion.net"
Issues = "https://github.com/aigestion/aigestion-core/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "Q", "RUF", "S", "PL", "PTH", "ERA", "RET", "SIM", "TCH", "TRY", "PERF", "FURB", "LOG", "ARG", "FIX", "FLY"]
ignore = ["BLE001", "S110", "UP017"]
fixable = ["F", "I", "W", "E", "N", "UP", "B", "C4", "T20", "Q", "RUF", "S", "PL", "PTH", "ERA", "RET", "SIM", "TCH", "TRY", "PERF", "FURB", "LOG", "ARG", "FIX", "FLY"]
# Bulk legacy code preserved under legacy/ (unintegrated, ungated).
exclude = ["src/daniela_core/legacy/**", "tests/legacy/**"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "TRY003", "S105", "PLC0415"]
# Legacy modules migrated as-is from aig/core (see MIGRATION_PLAN.md).
# S603: safe_exec deliberately avoids shell=True (its security property).
# PLW0603: singleton pattern via module-level global (events, registry).
# T201: legacy print-based logging preserved.
# S101: asserts narrow Optional for mypy AND document invariants
# (delegate() always assigns engine; connect() sets js/nc). No -O in prod.
"events.py" = ["T201", "PLW0603", "E501", "N814", "PERF401", "PLR0913", "SIM105", "TC003", "S101"]
"src/daniela_core/agents/agents.py" = ["E501"]
"registry.py" = ["PLR0913", "PLR2004", "PLW0603"]
"safe_exec.py" = ["T201", "S603", "PLC0415", "PTH111", "SIM108", "SIM210", "TRY003"]
"orchestrator.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = ["src/daniela_core/legacy/.*", "tests/legacy/.*"]

[[tool.mypy.overrides]]
module = "prometheus_fastapi_instrumentator.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nats.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Src layout: package lives in src/daniela_core/.
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]