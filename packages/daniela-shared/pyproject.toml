[project]
name = "daniela-shared"
version = "0.1.0"
description = "Daniela OS - Shared Infrastructure (AI Bridge, Cross-Device Sync, Pixel Guard, Memory RAG, Scheduler, State Manager)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "tenacity>=8.2",
    "python-dateutil>=2.8",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.0",
]
all = [
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "nats-py>=2.6",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41",
    "opentelemetry-instrumentation-httpx>=0.41",
    "opentelemetry-instrumentation-redis>=0.41",
    "opentelemetry-instrumentation-sqlalchemy>=0.41",
    "opentelemetry-exporter-otlp>=1.20",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_shared"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
ignore = ["BLE001", "S110", "UP017", "E402", "E741"]
per-file-ignores = { "src/daniela_shared/legacy/**/*.py" = ["ALL"] }
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "src/daniela_shared/legacy",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
warn_unused_configs = true
exclude = ["src/daniela_shared/legacy/.*"]

[[tool.mypy.overrides]]
module = "prometheus_fastapi_instrumentator.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short -p no:cacheprovider"

[tool.coverage.run]
source = ["src/daniela_shared"]
omit = ["*/tests/*", "*/legacy/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.urls]
Homepage = "https://github.com/aigestion/aigestion-universe"
Repository = "https://github.com/aigestion/aigestion-universe"
Issues = "https://github.com/aigestion/aigestion-universe/issues"


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "daniela_shared.connectors.android.bt_bridge",
    "daniela_shared.connectors.android.fcm_real_bridge",
    "daniela_shared.connectors.google.google_workspace",
    "daniela_shared.connectors.iot.mqtt_connector",
    "daniela_shared.connectors.wifi.wifi_aware",
    "daniela_shared.connectors.wifi.wifi_rtt",
    "daniela_shared.core_utils.ai_routing.connector",
    "daniela_shared.core_utils.ai_routing.middleware",
    "daniela_shared.core_utils.auth.casbin_auth",
    "daniela_shared.core_utils.auto_sanitizer",
    "daniela_shared.core_utils.business_store",
    "daniela_shared.core_utils.connections_manager",
    "daniela_shared.core_utils.cqrs",
    "daniela_shared.core_utils.cross_device_sync",
    "daniela_shared.core_utils.event_bus",
    "daniela_shared.core_utils.message_broker",
    "daniela_shared.core_utils.observability.otel",
    "daniela_shared.core_utils.pixel_guard",
    "daniela_shared.core_utils.scheduler",
    "daniela_shared.core_utils.unified_dashboard",
    "daniela_shared.core_utils.utils",
    "daniela_shared.core_utils.voice.wyoming_pipeline",
    "daniela_shared.core_utils.workflows.temporal_workflows",
    "daniela_shared.shared.ai.connector",
    "daniela_shared.shared.ai.middleware",
    "daniela_shared.shared.cross_device_sync",
    "daniela_shared.shared.db.sqlite_pool",
    "daniela_shared.shared.events",
    "daniela_shared.shared.metrics",
    "daniela_shared.shared.pixel_guard",
    "daniela_shared.shared.registry",
    "daniela_shared.shared.scheduler",
    "daniela_shared.shared.state_manager",
    "daniela_shared.shared.unified_dashboard",
    "daniela_shared.shared.utils",
