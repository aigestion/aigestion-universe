[project]
name = "daniela-secure"
version = "0.1.0"
description = "Daniela OS - Security Engine and SecOps"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "cryptography>=41.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "passlib>=1.7",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secure_engine", "secops"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "secops.deps_audit",
    "secops.hardening.rate_limiter",
    "secops.hardening.security_headers",
    "secops.hardening.waf_rules",
    "secops.penetration.api_fuzzer",
    "secops.penetration.penetration_test",
    "secops.scanners.cve_scanner",
    "secops.scanners.dependency_check",
    "secops.scanners.sast_scanner",
    "secops.scanners.secrets_audit",
]
ignore_errors = true
