[project]
name = "daniela-agents"
version = "0.1.0"
description = "Daniela OS - Agent Skills and Connectors"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "pydantic>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "skills",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.


# BASELINE-MYPY-2026-10-08: errores preexistentes migrados desde aig; endurecer incrementalmente.
[[tool.mypy.overrides]]
module = [
    "daniela_agents.skills.code",
    "daniela_agents.skills.code.ai.agent",
    "daniela_agents.skills.code.ai.ollama_manager",
    "daniela_agents.skills.code.devops.plugin_manager",
    "daniela_agents.skills.code.devops.self_healing",
    "daniela_agents.skills.code.security.security_monitor",
    "daniela_agents.skills.code.workspace.software_architect",
    "daniela_agents.skills.code.workspace.triage",
    "daniela_agents.skills.connectors.android.bt_bridge",
    "daniela_agents.skills.connectors.android.fcm_real_bridge",
    "daniela_agents.skills.connectors.google.google_workspace",
    "daniela_agents.skills.connectors.iot.mqtt_connector",
    "daniela_agents.skills.connectors.wifi.wifi_aware",
    "daniela_agents.skills.connectors.wifi.wifi_rtt",
]
ignore_errors = true
