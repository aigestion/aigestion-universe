[project]
name = "daniela-google"
version = "0.1.0"
description = "Daniela OS - Google Integrations (Free Tier Automations, Labs Suite, Media, Drive)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIGESTION", email = "team@aigestion.com"}]
requires-python = ">=3.11"
dependencies = [
    "daniela-core",
    "daniela-shared",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.uv.sources]
daniela-core = {path = "../daniela-core", editable = true}
daniela-shared = {path = "../daniela-shared", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daniela_google"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E4", "E7", "E9", "F"]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "google",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Baseline legacy migrado desde aig: sin strict, se endurece incrementalmente.
