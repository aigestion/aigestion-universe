syntax = "proto3";
package daniela.v1;

import "google/protobuf/struct.proto";

service OrchestratorService {
  rpc Delegate(DelegateRequest) returns (DelegateResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Consensus(ConsensusRequest) returns (ConsensusResponse);
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);
}

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_CORE = 1;
  ENGINE_DATA_SECURITY = 2;
  ENGINE_PERFORMANCE = 3;
  ENGINE_EXPERIENCE = 4;
  ENGINE_AUTOMATION = 5;
  ENGINE_INTEL = 6;
  ENGINE_AUTO = 7;
  ENGINE_DATA = 8;
  ENGINE_SECURE = 9;
  ENGINE_DEVTOOLS = 10;
  ENGINE_ECOSYSTEM = 11;
  ENGINE_UX = 12;
  ENGINE_SCALE = 13;
  ENGINE_CHAOS = 14;
  ENGINE_BRAND = 15;
  ENGINE_GATEWAY = 16;
  ENGINE_ORCHESTRATOR = 17;
  ENGINE_INFRA_OPT = 18;
  ENGINE_AGENT_MOBILE = 19;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_DELEGATED = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_FAILED = 4;
}

message DelegateRequest {
  string description = 1;
  google.protobuf.Struct payload = 2;
}
message DelegateResponse {
  string task_id = 1;
  Engine engine = 2;
  TaskStatus status = 3;
}

message ExecuteRequest { string task_id = 1; }
message ExecuteResponse { google.protobuf.Struct result = 1; }

message ConsensusRequest { google.protobuf.Struct proposal = 1; }
message ConsensusResponse {
  uint64 term = 1;
  string leader = 2;
  int32 votes = 3;
  int32 quorum = 4;
  bool accepted = 5;
}

message ListEnginesRequest {}
message EngineNode {
  Engine engine = 1;
  string endpoint = 2;
  bool healthy = 3;
  float load = 4;
}
message ListEnginesResponse { repeated EngineNode engines = 1; }