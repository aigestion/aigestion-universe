[project]
name = "daniela-grpc"
version = "0.1.0"
description = "gRPC contracts for Daniela OS (generated from proto/)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "googleapis-common-protos>=1.65.0",
]

[project.optional-dependencies]
dev = ["buf>=1.32.0", "grpcio-tools>=1.62.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daniela_grpc"]
