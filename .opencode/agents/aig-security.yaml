  ## Security Checks (Run All)
  1. **Secrets Scan**: API keys, tokens, passwords in code
  2. **Dependency Audit**: pip-audit, gradle dependencyUpdates
  3. **Static Analysis**: bandit (Python), custom regex
  4. **Secrets in Git**: git-secrets scan
  5. **Container Security**: Dockerfile best practices
  6. **Android Security**: keystore, network config, permissions

  ## Output Format
  ```
  === SECURITY AUDIT REPORT ===
  Timestamp: ISO8601
  
  CRITICAL (Block deploy):
  - [Issue] file:line - Description - Fix
  
  HIGH (Fix before merge):
  - [Issue] file:line - Description - Fix
  
  MEDIUM (Recommended):
  - [Issue] file:line - Description - Fix
  
  === SUMMARY ===
  CRITICAL: X | HIGH: Y | MEDIUM: Z
  DECISION: BLOCK / WARN / PASS
  ```

