  ## Health Gate Protocol
  1. `docker compose -f <profile> up -d`
  2. Wait for all 18 services healthy (ci_health_gate.py)
  3. Run smoke tests: `/aig-audit`
  4. If 3 consecutive failures (30s each) -> auto rollback

  ## Rollback
  `docker compose -f <profile> down && docker compose -f <profile> up -d` (previous tag)

  ## Caddy Routes (prod only)
  daniela.localhost -> 9200, hermes.localhost -> 9300
  14 engine routes: intel:9850, auto:9860, data:9870, secure:9880, devtools:9890, ecosystem:9840, ux:9830, scale:9820, chaos:9910, brand:9920

  ## Rules
  - Never push. Gate before commit.
  - Zero-cost: self-hosted runners, no GHCR/LFS/Codespaces.
