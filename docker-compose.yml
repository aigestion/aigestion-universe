version: '3.9'
services:
  daniela-core:
    build:
      context: ./packages/daniela-core
      dockerfile: Dockerfile
      network: host
    container_name: daniela-core
    ports:
    - 9200:9200
    environment:
    - DATABASE_URL=postgresql://daniela:changeme@postgres:5432/daniela
    - REDIS_URL=redis://:aig_redis_2026@redis:6379/0
    - SECRET_KEY=${SECRET_KEY}
    - ENVIRONMENT=production
    volumes:
    - daniela-data:/data
    depends_on:
    - postgres
    - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9200/health
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 30s
  postgres:
    image: pgvector/pgvector:pg16
    container_name: daniela-postgres
    environment:
    - POSTGRES_USER=daniela
    - POSTGRES_PASSWORD=changeme
    - POSTGRES_DB=daniela
    volumes:
    - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U daniela
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 30s
  redis:
    image: redis:7-alpine
    container_name: daniela-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - aig_redis_2026
    volumes:
    - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - aig_redis_2026
      - ping
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 10s
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: aigestion-caddy
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - caddy_data:/data
    - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    depends_on:
    - daniela-core
    - postgres
    - redis
    - prometheus
    - grafana
    - loki
    - tempo
    - daniela-api
    - daniela-ml
    - mobile-pwa-edge
    - daniela-tools-gateway
    - daniela-sandbox
    - minio
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: daniela-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  grafana:
    image: grafana/grafana:11.0.0
    container_name: daniela-grafana
    ports:
    - 3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
    - C:/tmp/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=__FILE__/run/secrets/grafana_password
    - GF_INSTALL_PLUGINS=grafana-piechart-panel
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    secrets:
    - grafana_password
  loki:
    image: grafana/loki:2.9.0
    container_name: daniela-loki
    ports:
    - 3100:3100
    volumes:
    - loki-data:/loki
    - ./configs/loki/loki.yml:/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  tempo:
    image: grafana/tempo:2.4.0
    container_name: daniela-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./configs/tempo/tempo.yml:/etc/tempo.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  daniela-api:
    build:
      context: ./packages/daniela-api
      dockerfile: Dockerfile
      additional_contexts:
        daniela-core: ./packages/daniela-core
        daniela-shared: ./packages/daniela-shared
    container_name: daniela-api
    environment:
    - DATABASE_URL=postgresql://daniela:changeme@postgres:5432/daniela
    - REDIS_URL=redis://redis:6379/0
    - AIGESTION_JWT_SECRET=${AIGESTION_JWT_SECRET:?define en .env}
    depends_on:
    - daniela-core
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  daniela-ml:
    build:
      context: ./packages/daniela-ml
      dockerfile: Dockerfile
      additional_contexts:
        daniela-core: ./packages/daniela-core
        daniela-shared: ./packages/daniela-shared
      network: host
    container_name: daniela-ml
    environment:
    - DATABASE_URL=postgresql://daniela:changeme@postgres:5432/daniela
    - REDIS_URL=redis://redis:6379/0
    depends_on:
    - daniela-core
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9810/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mobile-pwa-edge:
    build:
      context: ./apps/mobile-pwa
      dockerfile: services/Dockerfile
      network: host
    container_name: daniela-mobile-edge
    ports:
    - 9800:9800
    environment:
    - PIXEL_TOKEN=${PIXEL_TOKEN}
    - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9800/health
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 20s
  daniela-tools-gateway:
    build:
      context: ./apps/daniela-tools-gateway
      dockerfile: Dockerfile
      network: host
    container_name: daniela-tools-gateway
    ports:
    - 8083:8083
    environment:
    - GATEWAY_PORT=8083
    - LOG_LEVEL=info
    - ALLOW_MARKUP=false
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
    - daniela-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8083/health
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 20s
  daniela-sandbox:
    build:
      context: ./apps/daniela-sandbox
      dockerfile: Dockerfile
    container_name: daniela-sandbox
    ports:
    - 8090:8090
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8090/health
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 20s
  minio:
    image: chrislusf/seaweedfs:latest
    container_name: daniela-minio
    ports:
    - 9000:9000
    - 9333:9333
    command:
    - server
    - -dir=/data
    - -master.volumeSizeLimitMB=1024
    - -s3
    - -s3.port=9000
    volumes:
    - minio-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9333/cluster/status
      interval: 10s
      timeout: 5s
      retries: '5'
      start_period: 30s
volumes:
  daniela-data: null
  daniela-models: null
  postgres-data: null
  redis-data: null
  prometheus-data: null
  grafana-data: null
  loki-data: null
  caddy_data: null
  caddy_config: null
  minio-data: null
secrets:
  grafana_password:
    file: ./secrets/grafana_password.txt
