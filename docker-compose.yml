version: '3.9'

services:
  # === CORE SERVICES ===
  daniela-core:
    build:
      context: ./packages/daniela-core
      dockerfile: Dockerfile
    container_name: daniela-core
    ports:
      - "9200:9200"
    environment:
      - DATABASE_URL=postgresql://daniela:changeme@postgres:5432/daniela
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - daniela-data:/data
      - daniela-models:/models
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === DATABASE ===
  postgres:
    image: pgvector/pgvector:pg16
    container_name: daniela-postgres
    environment:
      - POSTGRES_DB=daniela
      - POSTGRES_USER=daniela
      - POSTGRES_PASSWORD=changeme
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daniela -d daniela"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === REDIS ===
  redis:
    image: redis:7-alpine
    container_name: daniela-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # === DANIELA SHELL (Frontend) ===
  daniela-shell:
    build:
      context: ./apps/daniela-shell
      dockerfile: Dockerfile
    container_name: daniela-shell
    environment:
      - NEXT_PUBLIC_API_URL=http://api.aigestion.net
      - NEXT_PUBLIC_WS_URL=wss://api.aigestion.net
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - daniela-core
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # === LANDING PAGE ===
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: aigestion-landing
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # === REVERSE PROXY ===
  caddy:
    image: caddy:2-alpine
    container_name: aigestion-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./apps/landing/public:/var/www/landing
    environment:
      - ADMIN_HTPASSWD=
    depends_on:
      - daniela-core
      - daniela-shell
      - landing
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # === OBSERVABILITY ===
  prometheus:
    image: prom/prometheus:v2.53
    container_name: daniela-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  grafana:
    image: grafana/grafana:11.0
    container_name: daniela-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    secrets:
      - grafana_password
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  loki:
    image: grafana/loki:2.9
    container_name: daniela-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./configs/loki/loki.yml:/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  tempo:
    image: grafana/tempo:2.4
    container_name: daniela-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - tempo-data:/tempo
      - ./configs/tempo/tempo.yml:/etc/tempo.yaml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # === TOOLS GATEWAY (BYOK/MCP, zero markup) ===
  daniela-tools-gateway:
    build:
      context: ./apps/daniela-tools-gateway
      dockerfile: Dockerfile
    container_name: daniela-tools-gateway
    ports:
      - "8083:8083"
    environment:
      - GATEWAY_PORT=8083
      - LOG_LEVEL=info
      - ALLOW_MARKUP=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      - daniela-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # === SANDBOX (isolated execution) ===
  daniela-sandbox:
    build:
      context: ./apps/daniela-sandbox
      dockerfile: Dockerfile
    container_name: daniela-sandbox
    ports:
      - "8090:8090"
    environment:
      - SANDBOX_PORT=8090
      - LOG_LEVEL=info
      - DEFAULT_TIMEOUT_S=30
      - DEFAULT_MAX_MEMORY_MB=512
      - DEFAULT_NETWORK=none
    volumes:
      # Docker socket for the docker executor (optional, remove to disable)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # === MOBILE EDGE (Termux API gateway, PC<->Pixel pairing) ===
  mobile-pwa-edge:
    build:
      context: ./apps/mobile-pwa/services
      dockerfile: Dockerfile
    container_name: daniela-mobile-edge
    ports:
      - "9800:9800"
    environment:
      - PIXEL_TOKEN=${PIXEL_TOKEN}
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  daniela-data:
  daniela-models:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  caddy_data:
  caddy_config:

secrets:
  grafana_password:
    file: ./secrets/grafana_password.txt
