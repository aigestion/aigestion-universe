name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -m "not network and not android" -q --tb=no -p no:cacheprovider

      - name: Lint
        run: |
          python -m ruff check . --ignore=BLE001 --ignore=S110 --ignore=UP017

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup k6
        uses: grafana/k6-action@v0.2.0
        with:
          version: latest

      - name: Start services
        run: |
          docker compose -f config/docker-compose.yml up -d
          sleep 30

      - name: Run load test
        run: |
          k6 run --out json=load-test-results.json load-test.js
        env:
          BASE_URL: http://localhost

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('load-test-results.json', 'utf8'));
            const summary = `
            ## 📊 Load Test Results
            
            | Metric | Value |
            |--------|-------|
            | Total Requests | ${results.metrics.http_reqs.values.count} |
            | Request Rate | ${results.metrics.http_reqs.values.rate.toFixed(2)}/s |
            | Avg Duration | ${results.metrics.http_req_duration.values.avg.toFixed(2)}ms |
            | p95 Duration | ${results.metrics.http_req_duration.values['p(95)'].toFixed(2)}ms |
            | p99 Duration | ${results.metrics.http_req_duration.values['p(99)'].toFixed(2)}ms |
            | Error Rate | ${(results.metrics.http_req_failed.values.rate * 100).toFixed(2)}% |
            | Custom Errors | ${results.metrics.errors.values.rate.toFixed(2)}% |
            
            ${results.metrics.http_req_duration.values['p(95)'] < 500 ? '✅ p95 < 500ms' : '❌ p95 >= 500ms'}
            ${results.metrics.http_req_failed.values.rate < 0.01 ? '✅ Error rate < 1%' : '❌ Error rate >= 1%'}
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail on thresholds
        run: |
          results=$(cat load-test-results.json)
          p95=$(echo "$results" | jq '.metrics.http_req_duration.values."p(95)"')
          errorRate=$(echo "$results" | jq '.metrics.http_req_failed.values.rate')
          customErrors=$(echo "$results" | jq '.metrics.errors.values.rate')
          
          if (( $(echo "$p95 >= 500" | bc -l) )); then echo "p95 latency ${p95}ms exceeds 500ms"; exit 1; fi
          if (( $(echo "$errorRate >= 0.01" | bc -l) )); then echo "Error rate ${errorRate} exceeds 1%"; exit 1; fi
          if (( $(echo "$customErrors >= 0.05" | bc -l) )); then echo "Custom error rate ${customErrors} exceeds 5%"; exit 1; fi
          
          echo "All thresholds passed!"