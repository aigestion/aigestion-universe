[project]
name = "mobile-pwa-edge"
version = "0.1.0"
description = "Termux edge gateway for Daniela Mobile"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.scripts]
termux-gateway = "services.termux_api_gateway:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
