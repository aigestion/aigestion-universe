[project]
name = "daniela-simulation"
version = "0.1.0"
description = "Simulation worlds for Daniela OS (MuJoCo / Isaac Lab / Genesis)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.2.0", "mujoco-mjx>=3.2.0"]
isaac = ["isaacsim>=4.0.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daniela_simulation"]
