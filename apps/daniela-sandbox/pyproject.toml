[project]
name = "daniela-sandbox"
version = "0.1.0"
description = "Isolated code/shell execution sandbox for Daniela OS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
docker = ["docker>=7.1.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[project.scripts]
daniela-sandbox = "services.sandbox:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
