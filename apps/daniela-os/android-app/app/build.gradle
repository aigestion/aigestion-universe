plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aigestion.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.aigestion.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // URL del backend, en un solo sitio y sobreescribible desde gradle.properties
        // o con -PapiBaseUrl=... (ver android-app/gradle.properties). En la app es
        // además editable en Ajustes, así que la IP de fábrica deja de estar escrita
        // a mano en el código Kotlin.
        buildConfigField "String", "API_BASE_URL",
                "\"${project.findProperty('apiBaseUrl') ?: 'http://192.168.1.170:5000'}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Coroutines explícitas: ChatApi/AppViewModel hacen Dispatchers.IO + StateFlow
    // y no conviene depender de que las traiga alguna androidx de paso.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    // ViewModel explícito: CreationExtras vive en lifecycle-viewmodel y no
    // conviene depender de que lo traiga de paso otro artefacto.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    // ViewModel + StateFlow: sobreviven a rotaciones y sacan el I/O de la UI.
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    // NO añadir 'org.json:json'. android.jar ya incluye org.json y meter el artefacto
    // de Maven provoca "Duplicate class org.json.JSONObject" al compilar. Se sigue
    // usando, pero la versión del framework.
}
