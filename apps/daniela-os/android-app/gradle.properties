# Necesario: las dependencias son todas de AndroidX (lifecycle, activity-compose,
# material3, core-ktx). Sin `android.useAndroidX=true` Gradle aborta con
# "This project uses AndroidX dependencies, but the 'android.useAndroidX' property is not enabled".
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ── URL del backend ───────────────────────────────────────────────────────────
# Se puede sobreescribir por línea de comandos sin tocar el código:
#   ./gradlew :app:assembleDebug -PapiBaseUrl=http://192.168.1.50:5000
# En tiempo de ejecución además es editable desde la pantalla de ajustes.
apiBaseUrl=http://192.168.1.170:5000
