// Raíz del proyecto. Sin este fichero Gradle no sabe qué plugins aplicar ni
// con qué versión, y `gradlew` falla antes de llegar a compilar nada.
//
// Versión del compiler de Compose acoplada a Kotlin 1.9.22 (ver app/build.gradle
// -> composeOptions.kotlinCompilerExtensionVersion '1.5.8'). Si se cambia el
// Kotlin, hay que mover ambas juntas.
plugins {
    id 'com.android.application' version '8.3.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
