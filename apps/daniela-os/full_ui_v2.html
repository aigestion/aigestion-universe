<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANIELA OS :: DREAM CORE v6.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #03060a;
            --panel-bg: rgba(8, 14, 23, 0.90);
            --primary-cyan: #00f0ff;
            --secondary-magenta: #e026de;
            --border-color: rgba(0, 240, 255, 0.25);
            --text-main: #d0f7ff;
            --success-green: #00ff66;
            --danger-red: #ff0055;
            --warning-gold: #ffaa00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .hud-main {
            width: 100%;
            height: 100vh;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 120px;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 10px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
        }

        .brand-title i { color: var(--secondary-magenta); }

        .version-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: var(--secondary-magenta);
            background: rgba(224, 38, 222, 0.12);
            border: 1px solid var(--secondary-magenta);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .hud-card-top {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            position: relative;
        }

        .core-display {
            position: relative;
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(3, 8, 14, 0.85);
        }

        #coreCanvas, #cameraFeed { width: 100%; height: 100%; object-fit: cover; }
        #cameraFeed { display: none; }

        .chat-area {
            flex: 1;
            background: rgba(2, 5, 8, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble { padding: 6px 8px; border-radius: 6px; max-width: 88%; word-wrap: break-word; line-height: 1.4; }
        .msg-user { background: rgba(0, 240, 255, 0.15); border: 1px solid var(--primary-cyan); align-self: flex-end; color: #fff; }
        .msg-ai { background: rgba(224, 38, 222, 0.12); border: 1px solid var(--secondary-magenta); align-self: flex-start; color: #d0f7ff; }

        /* TARJETA DE PROPUESTA AUDIOVISUAL MULTIMEDIA */
        .proposal-card {
            background: rgba(8, 18, 30, 0.95);
            border: 1px solid var(--primary-cyan);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            animation: fadeIn 0.4s ease-in-out;
        }

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 4px;
        }

        .proposal-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            color: #03060a;
            background: var(--warning-gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .proposal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--primary-cyan);
        }

        .proposal-body {
            font-size: 11px;
            color: #fff;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            border-left: 2px solid var(--secondary-magenta);
        }

        .proposal-actions {
            display: flex;
            gap: 6px;
        }

        .btn-approve {
            flex: 1;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--success-green);
            color: var(--success-green);
            padding: 8px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            cursor: pointer;
            text-align: center;
        }

        .btn-reject {
            flex: 1;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            padding: 8px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            cursor: pointer;
            text-align: center;
        }

        .gemini-fixed-dock {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 16px);
            max-width: 424px;
            background: rgba(8, 14, 23, 0.96);
            border: 1px solid var(--primary-cyan);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(12px);
            z-index: 999;
        }

        .dock-buttons-row { display: flex; justify-content: space-between; gap: 6px; }

        .dock-btn {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--primary-cyan);
            flex: 1;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
        }

        .gemini-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(3, 8, 14, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2px 8px;
        }

        .gemini-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            outline: none;
            padding: 6px 0;
        }

        #fileInput { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hud-main">
        <div class="header-panel">
            <div class="brand-title"><i class="fa-solid fa-brain"></i> DANIELA OS</div>
            <div class="version-badge">DREAM ENGINE v6.3</div>
        </div>

        <div class="hud-card-top">
            <div class="core-display">
                <canvas id="coreCanvas"></canvas>
                <video id="cameraFeed" autoplay playsinline></video>
            </div>
        </div>

        <div class="chat-area" id="chatHistory">
            <div class="msg-bubble msg-ai">[DANIELA]: Motor de Sueños Simulado activo. Evaluando 4 optimizaciones prioritarias de los sub-agentes...</div>
        </div>
    </div>

    <div class="gemini-fixed-dock">
        <div class="gemini-input-row">
            <input type="text" id="chatInput" class="gemini-input" placeholder="Di 'Daniela' o escribe una instrucción..." onkeypress="handleKeyPress(event)">
            <i class="fa-solid fa-paper-plane" style="color:var(--primary-cyan); cursor:pointer; padding:6px;" onclick="sendChatMessage()"></i>
        </div>

        <div class="dock-buttons-row">
            <button class="dock-btn" onclick="toggleCamera()"><i class="fa-solid fa-camera"></i></button>
            <button class="dock-btn" onclick="triggerFileUpload()"><i class="fa-solid fa-file-arrow-up"></i></button>
            <button class="dock-btn" style="color:var(--secondary-magenta);" onclick="presentTopDreamIdea()"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
            <button class="dock-btn" id="micBtn" onclick="forceSessionStart()"><i class="fa-solid fa-microphone"></i></button>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx" onchange="handleFileUpload(event)">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('coreCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.z = 2.6;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);

        const avatarGroup = new THREE.Group();
        scene.add(avatarGroup);

        const particleCount = 420;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const cyanColor = new THREE.Color(0x00f0ff);
        const magentaColor = new THREE.Color(0xe026de);

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const radius = 0.8 + (Math.random() * 0.15);

            let x = radius * Math.sin(v) * Math.cos(u) * 0.7;
            let y = radius * Math.cos(v) * 1.1;
            let z = radius * Math.sin(v) * Math.sin(u) * 0.6;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const chosenColor = (i < 80) ? magentaColor : cyanColor;
            colors[i * 3] = chosenColor.r;
            colors[i * 3 + 1] = chosenColor.g;
            colors[i * 3 + 2] = chosenColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending
        });

        const avatarPoints = new THREE.Points(geometry, material);
        avatarGroup.add(avatarPoints);

        let speakingAmplitude = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;

            avatarGroup.position.y = Math.sin(time) * 0.04;
            avatarGroup.rotation.y = Math.sin(time * 0.5) * 0.12;

            const positionAttr = geometry.attributes.position;
            for (let i = 80; i < 130; i++) {
                const baseY = positionAttr.getY(i);
                if (speakingAmplitude > 0) {
                    const mouthMove = Math.sin(time * 18 + i) * (0.06 + speakingAmplitude * 0.09);
                    positionAttr.setY(i, baseY + mouthMove * 0.012);
                }
            }
            positionAttr.needsUpdate = true;
            if (speakingAmplitude > 0) speakingAmplitude *= 0.92;

            renderer.render(scene, camera);
        }
        animate();

        /* LISTA DE PROPUESTAS DE SUEÑOS SIMULADOS POR LOS AGENTES */
        const dreamIdeas = [
            {
                tag: "IMPACTO ALTO :: FISCAL",
                title: "OPTIMIZACIÓN MODELO 600 ('Herencia Zapateros')",
                body: "Simulación Monte-Carlo detecta exención parcial aplicable. Ahorro tributario directo: <b>1.250€</b>. <br><b>Acción:</b> Generar borrador actualizado en Google Drive y notificar a la notaría.",
                audioText: "Comandante, he detectado una exención impositiva en el Modelo 600 con un ahorro de 1.250 euros. ¿Procedo a actualizar el borrador en Google Drive?"
            },
            {
                tag: "AUTOMATIZACIÓN :: GMAIL",
                title: "FILTRADO ZERO-INBOX & AUTO-RESPUESTA",
                body: "Clasificación inteligente de 14 correos pendientes. Borrador listo para respuesta formal al Notario Fernández.<br><b>Acción:</b> Enviar confirmación de cita para el jueves.",
                audioText: "He preparado el borrador de confirmación de cita para la Notaría Fernández. ¿Autorizas el envío?"
            },
            {
                tag: "SEGURIDAD :: BÚNKER",
                title: "RESPALDO CRIPTOGRÁFICO SHAMIR",
                body: "Sincronización de tokens de la Bóveda con GitHub Monorepo y aislamiento en enclave local.<br><b>Acción:</b> Registrar nuevo bloque SHA-256.",
                audioText: "Propongo registrar un nuevo bloque de auditoría criptográfica en GitHub. ¿Ejecutamos el respaldo?"
            }
        ];

        let currentDreamIdx = 0;

        function presentTopDreamIdea() {
            const idea = dreamIdeas[currentDreamIdx % dreamIdeas.length];
            currentDreamIdx++;

            const history = document.getElementById('chatHistory');
            const card = document.createElement('div');
            card.className = 'proposal-card';
            card.innerHTML = `
                <div class="proposal-header">
                    <span class="proposal-title"><i class="fa-solid fa-sparkles"></i> PROPUESTA #1 DE DANIELA</span>
                    <span class="proposal-tag">${idea.tag}</span>
                </div>
                <div style="font-weight:bold; font-size:11px; color:#00f0ff;">${idea.title}</div>
                <div class="proposal-body">${idea.body}</div>
                <div class="proposal-actions">
                    <button class="btn-approve" onclick="respondProposal(this, true)"><i class="fa-solid fa-check"></i> APROBAR</button>
                    <button class="btn-reject" onclick="respondProposal(this, false)"><i class="fa-solid fa-xmark"></i> RECHAZAR</button>
                </div>
            `;
            history.appendChild(card);
            history.scrollTop = history.scrollHeight;
            speakingAmplitude = 1.2;
            speak(idea.audioText);
        }

        function respondProposal(btn, approved) {
            const card = btn.closest('.proposal-card');
            if (approved) {
                card.style.borderColor = '#00ff66';
                card.innerHTML = `<div style="color:#00ff66; font-family:'Orbitron'; font-size:10px;"><i class="fa-solid fa-circle-check"></i> PROPUESTA APROBADA :: Ejecutando cambio en Google Workspace y Bóveda...</div>`;
                speakingAmplitude = 1.0;
                speak("Propuesta ejecutada correctamente en el sistema.");
            } else {
                card.style.borderColor = '#ff0055';
                card.innerHTML = `<div style="color:#ff0055; font-family:'Orbitron'; font-size:10px;"><i class="fa-solid fa-circle-xmark"></i> PROPUESTA RECHAZADA :: Pasando a la siguiente opción...</div>`;
                speakingAmplitude = 1.0;
                speak("Propuesta descartada. Pasando a la siguiente oportunidad.");
            }
        }

        function appendMsg(sender, text) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = `msg-bubble msg-${sender}`;
            div.innerText = sender === 'user' ? `[COMANDANTE]: ${text}` : `[DANIELA]: ${text}`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            appendMsg('user', msg);
            input.value = '';

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            })
            .then(res => res.json())
            .then(data => {
                appendMsg('ai', data.response);
                speakingAmplitude = 1.5;
                const textToSpeak = data.audio_speech || data.response;
                speak(textToSpeak);
            });
        }

        function forceSessionStart() {
            speakingAmplitude = 1.0;
            speak("Dime, Alejandro.");
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
        }

        let cameraActive = false;
        async function toggleCamera() {
            const video = document.getElementById('cameraFeed');
            const canvas3D = document.getElementById('coreCanvas');

            if (!cameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    canvas3D.style.display = 'none';
                    cameraActive = true;
                } catch (err) { alert('Cámara no accesible'); }
            } else {
                const stream = video.srcObject;
                if (stream) stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                canvas3D.style.display = 'block';
                cameraActive = false;
            }
        }

        function triggerFileUpload() { document.getElementById('fileInput').click(); }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const history = document.getElementById('chatHistory');
                const div = document.createElement('div');
                div.className = 'msg-bubble msg-user';
                div.innerHTML = `[COMANDANTE]: <b>${file.name}</b>`;
                history.appendChild(div);
                history.scrollTop = history.scrollHeight;

                setTimeout(() => {
                    const reply = `Archivo "${file.name}" asimilado por el enclave.`;
                    appendMsg('ai', reply);
                    speakingAmplitude = 1.0;
                    speak(reply);
                }, 800);
            };
            reader.readAsDataURL(file);
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendChatMessage(); }
    </script>
</body>
</html>
