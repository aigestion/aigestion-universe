<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daniela Unified 3D Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #000; 
            overflow: hidden;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .hud-panel {
            position: absolute;
            background: rgba(10, 10, 26, 0.85);
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 12px;
            color: #eee;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .hud-title {
            color: #00ff88;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .hud-metric {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }
        .hud-label {
            font-size: 10px;
            color: #888;
        }
        .hud-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 4px 0;
            overflow: hidden;
        }
        .hud-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            border-radius: 2px;
        }
        
        /* PC Layout */
        @media (min-width: 768px) {
            #panel-agents { top: 20px; left: 20px; width: 220px; }
            #panel-system { top: 20px; right: 20px; width: 220px; }
            #panel-brain { bottom: 20px; left: 20px; width: 280px; }
            #panel-missions { bottom: 20px; right: 20px; width: 280px; }
            #panel-content { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; text-align: center; }
            #panel-google { top: 20px; left: 50%; transform: translateX(-50%); width: 200px; }
            #panel-sync { bottom: 20px; left: 50%; transform: translateX(-50%); width: 200px; }
        }
        
        /* Mobile Layout */
        @media (max-width: 767px) {
            .hud-panel { padding: 8px; border-radius: 8px; }
            .hud-title { font-size: 10px; }
            .hud-metric { font-size: 16px; }
            .hud-label { font-size: 9px; }
            
            #panel-agents { top: 10px; left: 10px; right: 10px; width: auto; }
            #panel-system { top: 80px; left: 10px; right: 10px; width: auto; }
            #panel-brain { top: 150px; left: 10px; right: 10px; width: auto; }
            #panel-missions { display: none; }
            #panel-content { bottom: 10px; left: 10px; right: 10px; width: auto; transform: none; }
            #panel-google { display: none; }
            #panel-sync { display: none; }
        }
        
        .agent-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 11px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-idle { background: #ffaa00; }
        .status-error { background: #ff4444; }
        .glow {
            text-shadow: 0 0 10px #00ff88;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div id="panel-agents" class="hud-panel">
            <div class="hud-title">🤖 Agentes</div>
            <div class="hud-metric" id="agents-count">34/34</div>
            <div class="hud-label">Activos</div>
            <div id="agents-list"></div>
        </div>
        
        <div id="panel-system" class="hud-panel">
            <div class="hud-title">💻 Sistema</div>
            <div class="hud-label">CPU</div>
            <div class="hud-bar"><div class="hud-bar-fill" id="cpu-bar" style="width: 0%"></div></div>
            <div class="hud-label">RAM</div>
            <div class="hud-bar"><div class="hud-bar-fill" id="ram-bar" style="width: 0%"></div></div>
            <div class="hud-label">Disco</div>
            <div class="hud-bar"><div class="hud-bar-fill" id="disk-bar" style="width: 0%"></div></div>
        </div>
        
        <div id="panel-brain" class="hud-panel">
            <div class="hud-title">🧠 Cerebro</div>
            <div class="hud-metric" id="brain-facts">0</div>
            <div class="hud-label">Hechos</div>
            <div class="hud-metric" id="brain-insights">0</div>
            <div class="hud-label">Insights</div>
        </div>
        
        <div id="panel-missions" class="hud-panel">
            <div class="hud-title">🎯 Misiones</div>
            <div class="hud-metric" id="missions-active">0</div>
            <div class="hud-label">Activas</div>
        </div>
        
        <div id="panel-content" class="hud-panel">
            <div class="hud-title">🎬 Contenido</div>
            <div class="hud-metric" id="videos-created">0</div>
            <div class="hud-label">Videos</div>
            <div class="hud-metric" id="posts-published">0</div>
            <div class="hud-label">Posts</div>
        </div>
        
        <div id="panel-google" class="hud-panel">
            <div class="hud-title">🔮 Google</div>
            <div class="hud-metric" id="google-active">4/4</div>
            <div class="hud-label">Servicios</div>
        </div>
        
        <div id="panel-sync" class="hud-panel">
            <div class="hud-title">🔄 Sync</div>
            <div class="hud-metric" id="sync-status">OK</div>
            <div class="hud-label">Teléfono ↔ PC</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Detectar dispositivo
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // Escena 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Luz
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ff88, 1, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Núcleo de Daniela
        const coreSize = isMobile ? 1.5 : 2;
        const coreGeometry = new THREE.IcosahedronGeometry(coreSize, 2);
        const coreMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ff88,
            emissive: 0x00ff88,
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.8,
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);

        // Anillos orbitales
        const rings = [];
        const ringCount = isMobile ? 2 : 3;
        for (let i = 0; i < ringCount; i++) {
            const ringGeometry = new THREE.TorusGeometry(coreSize + 1 + i * 1.2, 0.04, 16, 100);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: i === 0 ? 0x00ff88 : i === 1 ? 0x00ccff : 0xff00ff,
                transparent: true,
                opacity: 0.6,
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            ring.rotation.y = i * 0.5;
            scene.add(ring);
            rings.push(ring);
        }

        // Partículas
        const particleCount = isMobile ? 50 : 100;
        const particlesGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            const radius = (isMobile ? 4 : 5) + Math.random() * (isMobile ? 6 : 10);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00ff88,
            size: isMobile ? 0.08 : 0.1,
            transparent: true,
            opacity: 0.8,
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        camera.position.z = isMobile ? 12 : 15;

        // Animación
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            core.rotation.x += 0.005;
            core.rotation.y += 0.01;

            const scale = 1 + Math.sin(time * 2) * 0.1;
            core.scale.set(scale, scale, scale);

            rings.forEach((ring, i) => {
                ring.rotation.z += 0.005 * (i + 1);
            });

            particles.rotation.y += 0.001;
            particles.rotation.x += 0.0005;

            if (!isMobile) {
                camera.position.x = Math.sin(time * 0.5) * 2;
                camera.position.y = Math.cos(time * 0.3) * 2;
            }
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Touch controls para móvil
        if (isMobile) {
            let touchStartX = 0;
            let touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            document.addEventListener('touchmove', (e) => {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                camera.position.x += deltaX * 0.01;
                camera.position.y -= deltaY * 0.01;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
        }

        // Actualizar HUD
        function updateHUD() {
            fetch('/api/live')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('agents-count').textContent = `${data.agents_active}/${data.agents_total}`;
                    document.getElementById('cpu-bar').style.width = `${data.cpu}%`;
                    document.getElementById('ram-bar').style.width = `${data.ram}%`;
                    document.getElementById('disk-bar').style.width = `${data.disk}%`;
                    document.getElementById('brain-facts').textContent = data.facts;
                    document.getElementById('brain-insights').textContent = data.insights;
                    document.getElementById('missions-active').textContent = data.missions_active;
                    document.getElementById('videos-created').textContent = data.videos_created;
                    document.getElementById('posts-published').textContent = data.posts_published;
                    document.getElementById('sync-status').textContent = data.sync_status;
                    
                    const agentsList = document.getElementById('agents-list');
                    agentsList.innerHTML = data.agents.slice(0, isMobile ? 5 : 10).map(a => `
                        <div class="agent-row">
                            <span>${a.name}</span>
                            <span class="status-dot status-${a.status}"></span>
                        </div>
                    `).join('');
                });
        }
        setInterval(updateHUD, 5000);
        updateHUD();
    </script>
</body>
</html>
