<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgI" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f1428"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cyI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="mgI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="gI" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gIs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgI)"/>

  <!-- Animated grid (static frame, animation via ffmpeg) -->
  <g stroke="#1a2a4a" stroke-width="1.5" opacity="0.12">
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="0" y1="1680" x2="1080" y2="1680"/>
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- Scan line effect -->
  <rect x="0" y="500" width="1080" height="3" fill="#00ffff" opacity="0.15" filter="url(#gIs)"/>

  <!-- Corner brackets -->
  <g stroke="#00ffff" stroke-width="4" fill="none" opacity="0.4" filter="url(#gIs)">
    <polyline points="40,100 40,40 100,40"/>
    <polyline points="980,40 1040,40 1040,100"/>
    <polyline points="40,1820 40,1880 100,1880"/>
    <polyline points="980,1880 1040,1880 1040,1820"/>
  </g>

  <!-- Logo (centered, large) -->
  <g transform="translate(390, 500)" filter="url(#gI)">
    <!-- Outer hexagon -->
    <polygon points="150,20 260,80 260,220 150,280 40,220 40,80"
             fill="none" stroke="url(#cyI)" stroke-width="4" opacity="0.6"/>
    <!-- Inner hexagon -->
    <polygon points="150,45 235,92 235,208 150,255 65,208 65,92"
             fill="none" stroke="url(#mgI)" stroke-width="3" opacity="0.4"/>
    <!-- Circuit A -->
    <line x1="115" y1="215" x2="150" y2="100" stroke="url(#cyI)" stroke-width="12" stroke-linecap="round"/>
    <line x1="185" y1="215" x2="150" y2="100" stroke="url(#mgI)" stroke-width="12" stroke-linecap="round"/>
    <line x1="128" y1="158" x2="172" y2="158" stroke="url(#cyI)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="100" r="11" fill="#00ffff"/>
    <circle cx="115" cy="215" r="10" fill="#ff0055"/>
    <circle cx="185" cy="215" r="10" fill="#00ffff"/>
    <circle cx="150" cy="158" r="8" fill="#ff0055"/>
  </g>

  <!-- Title -->
  <text x="540" y="960" text-anchor="middle"
        font-family="'Segoe UI', 'Arial Black', sans-serif"
        font-size="96" font-weight="bold"
        fill="#00ffff" letter-spacing="16"
        filter="url(#gI)">AIGESTION</text>

  <!-- Underline accent -->
  <line x1="300" y1="1000" x2="780" y2="1000" stroke="url(#cyI)" stroke-width="3" opacity="0.5"/>
  <line x1="380" y1="1010" x2="700" y2="1010" stroke="url(#mgI)" stroke-width="2" opacity="0.3"/>

  <!-- Tagline -->
  <text x="540" y="1080" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="42" font-weight="normal"
        fill="#ff0055" letter-spacing="10"
        filter="url(#gI)" opacity="0.9">GESTION INTELIGENTE</text>

  <text x="540" y="1140" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="42" font-weight="normal"
        fill="#00ffff" letter-spacing="10"
        filter="url(#gI)" opacity="0.9">CON INTELIGENCIA ARTIFICIAL</text>

  <!-- Decorative data bars (simulated dashboard) -->
  <g transform="translate(200, 1300)" opacity="0.25">
    <rect x="0" y="0" width="680" height="6" rx="3" fill="#1a2a4a"/>
    <rect x="0" y="0" width="480" height="6" rx="3" fill="url(#cyI)" filter="url(#gIs)"/>
    <rect x="0" y="20" width="680" height="6" rx="3" fill="#1a2a4a"/>
    <rect x="0" y="20" width="320" height="6" rx="3" fill="url(#mgI)" filter="url(#gIs)"/>
    <rect x="0" y="40" width="680" height="6" rx="3" fill="#1a2a4a"/>
    <rect x="0" y="40" width="550" height="6" rx="3" fill="url(#cyI)" filter="url(#gIs)"/>
  </g>

  <!-- Circuit nodes decoration -->
  <g opacity="0.2" filter="url(#gIs)">
    <circle cx="120" cy="1500" r="4" fill="#00ffff"/>
    <line x1="124" y1="1500" x2="200" y2="1500" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="960" cy="1500" r="4" fill="#ff0055"/>
    <line x1="880" y1="1500" x2="956" y2="1500" stroke="#ff0055" stroke-width="1.5"/>
  </g>

  <!-- Watermark -->
  <text x="540" y="1840" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="24" fill="#3a4a6a"
        opacity="0.5">aigestion.net</text>
</svg>

