<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgT" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0f1428"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="cyT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="mgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="gT" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gTs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgT)"/>

  <!-- Diagonal accent stripe (right side) -->
  <polygon points="780,0 1280,0 1280,720 780,720" fill="#080c18" opacity="0.6"/>
  <line x1="780" y1="0" x2="780" y2="720" stroke="url(#mgT)" stroke-width="3" opacity="0.4" filter="url(#gTs)"/>

  <!-- Left side content area (placeholder for video screenshot/topic image) -->
  <rect x="20" y="20" width="740" height="680" fill="#0a0e1a" stroke="url(#cyT)" stroke-width="2" rx="8" opacity="0.5"/>
  <text x="390" y="380" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="28" fill="#2a3a5a" opacity="0.5">[ IMAGEN / SCREENSHOT AQUI ]</text>

  <!-- Circuit decoration on left border -->
  <g opacity="0.2" filter="url(#gTs)">
    <circle cx="40" cy="100" r="4" fill="#00ffff"/>
    <line x1="44" y1="100" x2="100" y2="100" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="40" cy="300" r="4" fill="#ff0055"/>
    <line x1="44" y1="300" x2="100" y2="300" stroke="#ff0055" stroke-width="1.5"/>
    <circle cx="40" cy="500" r="4" fill="#00ffff"/>
    <line x1="44" y1="500" x2="100" y2="500" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="40" cy="620" r="4" fill="#ff0055"/>
    <line x1="44" y1="620" x2="100" y2="620" stroke="#ff0055" stroke-width="1.5"/>
  </g>

  <!-- Right side: Logo + Title -->
  <!-- Logo -->
  <g transform="translate(860, 80)" filter="url(#gT)">
    <polygon points="75,10 130,42 130,108 75,140 20,108 20,42"
             fill="none" stroke="url(#cyT)" stroke-width="2.5" opacity="0.6"/>
    <polygon points="75,22 118,46 118,104 75,128 32,104 32,46"
             fill="none" stroke="url(#mgT)" stroke-width="1.5" opacity="0.4"/>
    <line x1="60" y1="105" x2="75" y2="50" stroke="url(#cyT)" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="105" x2="75" y2="50" stroke="url(#mgT)" stroke-width="6" stroke-linecap="round"/>
    <line x1="65" y1="78" x2="85" y2="78" stroke="url(#cyT)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="50" r="5" fill="#00ffff"/>
    <circle cx="60" cy="105" r="4" fill="#ff0055"/>
    <circle cx="90" cy="105" r="4" fill="#00ffff"/>
  </g>

  <!-- AIGESTION text -->
  <text x="1020" y="260" text-anchor="middle"
        font-family="'Segoe UI', 'Arial Black', sans-serif"
        font-size="52" font-weight="bold"
        fill="#00ffff" letter-spacing="8"
        filter="url(#gT)">AIGESTION</text>

  <!-- Title placeholder (large, eye-catching) -->
  <text x="1020" y="340" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="36" font-weight="bold"
        fill="#ff0055" letter-spacing="2">[ TITULO VIRAL ]</text>

  <text x="1020" y="390" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="24" fill="#3a6a8a">Aqui va el titulo del video</text>

  <!-- Accent line -->
  <line x1="860" y1="420" x2="1180" y2="420" stroke="url(#cyT)" stroke-width="2" opacity="0.4"/>
  <line x1="900" y1="430" x2="1140" y2="430" stroke="url(#mgT)" stroke-width="1" opacity="0.3"/>

  <!-- Tag/Badge area -->
  <g transform="translate(880, 470)">
    <rect x="0" y="0" width="280" height="50" rx="25" fill="none" stroke="url(#cyT)" stroke-width="2" filter="url(#gTs)"/>
    <text x="140" y="33" text-anchor="middle"
          font-family="'Segoe UI', sans-serif"
          font-size="22" font-weight="bold"
          fill="#00ffff" letter-spacing="3">[ TAG / CATEGORIA ]</text>
  </g>

  <!-- Episode number area -->
  <text x="1020" y="580" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="64" font-weight="bold"
        fill="url(#mgT)" opacity="0.3" filter="url(#gT)">#001</text>

  <!-- Bottom bar -->
  <rect x="0" y="700" width="1280" height="20" fill="url(#cyT)" opacity="0.3"/>
  <rect x="0" y="700" width="1280" height="2" fill="url(#mgT)" opacity="0.5"/>
</svg>
