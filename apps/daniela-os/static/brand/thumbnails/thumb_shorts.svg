<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgS" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f1428"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="cyS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="mgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="gS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gSs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgS)"/>

  <!-- Top bar with logo -->
  <g transform="translate(430, 60)" filter="url(#gS)" opacity="0.9">
    <polygon points="100,15 170,55 170,145 100,185 30,145 30,55"
             fill="none" stroke="url(#cyS)" stroke-width="3" opacity="0.6"/>
    <polygon points="100,30 155,62 155,138 100,170 45,138 45,62"
             fill="none" stroke="url(#mgS)" stroke-width="2" opacity="0.4"/>
    <line x1="80" y1="140" x2="100" y2="70" stroke="url(#cyS)" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="140" x2="100" y2="70" stroke="url(#mgS)" stroke-width="8" stroke-linecap="round"/>
    <line x1="87" y1="107" x2="113" y2="107" stroke="url(#cyS)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="70" r="7" fill="#00ffff"/>
    <circle cx="80" cy="140" r="6" fill="#ff0055"/>
    <circle cx="120" cy="140" r="6" fill="#00ffff"/>
  </g>

  <!-- Content area (placeholder for video frame/screenshot) -->
  <rect x="60" y="300" width="960" height="1000" fill="#0a0e1a" stroke="url(#cyS)" stroke-width="2" rx="12" opacity="0.4"/>
  <text x="540" y="820" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="36" fill="#2a3a5a" opacity="0.5">[ FRAME DEL VIDEO ]</text>

  <!-- Viral hook text area (top, eye-catching) -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="920" height="100" rx="10" fill="#0b0f19" stroke="url(#mgS)" stroke-width="3" filter="url(#gSs)" opacity="0.8"/>
    <text x="460" y="65" text-anchor="middle"
          font-family="'Segoe UI', 'Arial Black', sans-serif"
          font-size="48" font-weight="bold"
          fill="#ff0055" letter-spacing="4"
          filter="url(#gS)">[ HOOK VIRAL AQUI ]</text>
  </g>

  <!-- Title text area (bottom, large) -->
  <g transform="translate(80, 1320)">
    <rect x="0" y="0" width="920" height="140" rx="10" fill="#0b0f19" stroke="url(#cyS)" stroke-width="3" filter="url(#gSs)" opacity="0.8"/>
    <text x="460" y="90" text-anchor="middle"
          font-family="'Segoe UI', 'Arial Black', sans-serif"
          font-size="56" font-weight="bold"
          fill="#00ffff" letter-spacing="4"
          filter="url(#gS)">[ TITULO DEL SHORT ]</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#00ffff" stroke-width="3" fill="none" opacity="0.3" filter="url(#gSs)">
    <polyline points="20,60 20,20 60,20"/>
    <polyline points="1020,20 1060,20 1060,60"/>
    <polyline points="20,1860 20,1900 60,1900"/>
    <polyline points="1020,1900 1060,1900 1060,1860"/>
  </g>

  <!-- Bottom CTA -->
  <text x="540" y="1760" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="32" fill="#3a6a8a"
        opacity="0.7">@AIGestion | Desliza para mas</text>
</svg>
