<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DANIELA OS - NEURAL CORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #01050e; font-family: 'Courier New', monospace; color: #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
        #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

        body::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%); background-size: 100% 4px; z-index: 20; pointer-events: none; opacity: 0.5; }

        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .top-container { pointer-events: auto; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .pill-brand { background: rgba(0,10,25,0.9); border: 1.5px solid #00f0ff; color: #00f0ff; padding: 4px 14px; border-radius: 20px; font-weight: bold; font-size: 0.7rem; letter-spacing: 0.5px; box-shadow: 0 0 12px rgba(0,240,255,0.5); }
        .pill-user { background: rgba(224, 36, 195, 0.15); border: 1.5px solid #e024c3; color: #e024c3; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; }
        
        .live-telemetry-bar { background: rgba(0, 10, 20, 0.85); border: 1px solid #00ff66; color: #00ff66; padding: 4px 10px; border-radius: 8px; font-size: 0.6rem; display: flex; gap: 12px; margin-top: 4px; box-shadow: 0 0 8px rgba(0,255,102,0.3); }

        .neural-label { position: absolute; pointer-events: auto; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: opacity 0.3s ease; }
        .neural-label:active { transform: translate(-50%, -100%) scale(0.93); }
        .label-text-box { background: rgba(1, 10, 25, 0.92); border: 1.5px solid #00f0ff; border-radius: 6px; padding: 3px 8px; font-size: 0.62rem; font-weight: bold; color: #00f0ff; white-space: nowrap; box-shadow: 0 0 10px rgba(0,240,255,0.4); margin-bottom: 2px; }
        .label-icon-box { background: rgba(5, 5, 15, 0.95); border: 1.5px solid #00f0ff; border-radius: 12px; padding: 2px 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .status-led { width: 6px; height: 6px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 6px #00ff66; }
        .node-emoji { font-size: 0.85rem; }

        .bottom-container { display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: auto; margin-bottom: 8px; }
        .mic-btn { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(1, 5, 15, 0.95) 100%); border: 2px solid #00f0ff; color: #fff; font-size: 1.6rem; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        .mic-btn.active { border-color: #00ff66; box-shadow: 0 0 30px #00ff66; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <div class="hud-overlay">
        <div class="top-container">
            <div class="row-header">
                <div class="pill-brand">DANIELA OS - NEURAL AEGIS CORE</div>
                <div class="pill-user">admin@aigestion.net [ADMIN]</div>
            </div>
            <div class="live-telemetry-bar">
                <span id="tele-cpu">CPU: 12%</span>
                <span id="tele-ram">RAM: 1.3 GB</span>
                <span id="tele-status" style="color: #00ff66;">HTTP: ONLINE</span>
            </div>
        </div>

        <div class="bottom-container">
            <button class="mic-btn" id="mic-btn" onclick="toggleVoice()">🎙️</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, brainGroup, controls;
        let brainParticles, forcefieldRing;
        let isListening = false, recognition = null;
        const allLabelElements = [];
        const stationEntities = [];

        const NEURAL_NODES = [
            { id: "N1", name: "COGNITION ARCHIVE", icon: "🧠", x: -4.5, y: 0.8, z: -1.0, color: 0x00f0ff },
            { id: "N2", name: "NEURAL LOGISTICS", icon: "📊", x: -4.2, y: 2.5, z: -2.0, color: 0x00aaff },
            { id: "N3", name: "SECURITY FORCEFIELD", icon: "🛡️", x: 2.2, y: 2.2, z: 1.0, color: 0xff2255 },
            { id: "N4", name: "FEDERATED CONSTELLATION", icon: "🌌", x: 4.8, y: 2.6, z: -2.5, color: 0xe024c3 },
            { id: "N5", name: "MEMORY RESIDUE", icon: "🗄️", x: 4.5, y: 0.9, z: -1.2, color: 0x00ff66 },
            { id: "N6", name: "SENSORY INPUT MATRIX", icon: "🎙️", x: 4.2, y: -0.8, z: 0.5, color: 0x00f0ff }
        ];

        function triggerHaptic() {
            if ('vibrate' in navigator) navigator.vibrate(12);
        }

        function init3DEnvironment() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 10.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            brainGroup = new THREE.Group();

            const gridHelper = new THREE.GridHelper(24, 30, 0x00f0ff, 0x001530);
            gridHelper.position.y = -2.8;
            scene.add(gridHelper);

            const count = 2000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI;
                const r = 1.3 + Math.sin(u * 4) * 0.2 + Math.cos(v * 3) * 0.15;

                pos[i] = r * Math.sin(v) * Math.cos(u) * 1.3;
                pos[i+1] = r * Math.sin(v) * Math.sin(u) * 0.9;
                pos[i+2] = r * Math.cos(v) * 0.95;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            brainParticles = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.035, transparent: true, opacity: 0.85 }));
            brainGroup.add(brainParticles);

            const ringGeo = new THREE.RingGeometry(1.6, 1.75, 64);
            forcefieldRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xe024c3, side: THREE.DoubleSide, transparent: true, opacity: 0.6, wireframe: true }));
            forcefieldRing.rotation.x = Math.PI / 2;
            brainGroup.add(forcefieldRing);

            renderNodes();
            scene.add(brainGroup);
            animate();
            startPolling();
        }

        function renderNodes() {
            const container = document.getElementById('labels-container');
            container.innerHTML = "";

            NEURAL_NODES.forEach((sData) => {
                const nodeMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18, 16, 16),
                    new THREE.MeshBasicMaterial({ color: sData.color })
                );
                nodeMesh.position.set(sData.x, sData.y, sData.z);
                brainGroup.add(nodeMesh);

                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(sData.x * 0.5, sData.y * 0.5 + 0.3, sData.z * 0.5),
                    new THREE.Vector3(sData.x, sData.y, sData.z)
                ]);
                const points = curve.getPoints(50);
                const axonLine = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(points),
                    new THREE.LineBasicMaterial({ color: sData.color, transparent: true, opacity: 0.45 })
                );
                brainGroup.add(axonLine);

                const labelEl = document.createElement('div');
                labelEl.className = 'neural-label';
                labelEl.innerHTML = `
                    <div class="label-text-box">${sData.name}</div>
                    <div class="label-icon-box">
                        <span class="status-led"></span>
                        <span class="node-emoji">${sData.icon}</span>
                    </div>
                `;
                labelEl.onclick = () => { triggerHaptic(); focusOnNode(nodeMesh); };
                container.appendChild(labelEl);

                const item = { mesh: nodeMesh, element: labelEl, x: 0, y: 0, renderX: 0, renderY: 0 };
                stationEntities.push(item);
                allLabelElements.push(item);
            });
        }

        function focusOnNode(targetMesh) {
            const worldPos = new THREE.Vector3();
            targetMesh.getWorldPosition(worldPos);
            controls.target.copy(worldPos);
            controls.update();
        }

        function startPolling() {
            setInterval(() => {
                fetch('/api/telemetry', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.cpu_load) document.getElementById('tele-cpu').innerText = `CPU: ${data.cpu_load}`;
                        if (data.ram_usage) document.getElementById('tele-ram').innerText = `RAM: ${data.ram_usage}`;
                    }).catch(() => {});
            }, 3000);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'es-ES';
                window.speechSynthesis.speak(u);
            }
        }

        function toggleVoice() {
            triggerHaptic();
            const btn = document.getElementById('mic-btn');
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;

            if (!isListening) {
                recognition = new SR();
                recognition.lang = 'es-ES';
                recognition.onstart = () => { isListening = true; btn.classList.add('active'); };
                recognition.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    fetch('/api/chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ message: txt })
                    }).then(r => r.json()).then(d => {
                        speak(d.reply);
                    });
                };
                recognition.onend = () => { isListening = false; btn.classList.remove('active'); };
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        function updatePositions() {
            stationEntities.forEach(s => {
                const tempV = new THREE.Vector3();
                s.mesh.getWorldPosition(tempV);
                tempV.project(camera);

                s.x = (tempV.x * .5 + .5) * window.innerWidth;
                s.y = (tempV.y * -.5 + .5) * window.innerHeight;
            });

            allLabelElements.forEach(item => {
                if (item.renderX === 0) { item.renderX = item.x; item.renderY = item.y; }
                item.renderX += (item.x - item.renderX) * 0.1;
                item.renderY += (item.y - item.renderY) * 0.1;

                item.element.style.left = `${item.renderX}px`;
                item.element.style.top = `${item.renderY}px`;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (brainParticles) brainParticles.rotation.y += 0.0025;
            if (forcefieldRing) forcefieldRing.rotation.z += 0.008;

            controls.update();
            updatePositions();
            renderer.render(scene, camera);
        }

        window.onload = init3DEnvironment;
    </script>
</body>
</html>
