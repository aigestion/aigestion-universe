<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daniela — Pixel Dashboard</title>
<style>
:root{
  --cyan:#00ffff; --magenta:#ff0055; --dark:#0b0f19;
  --panel:#141b2d; --border:#1f2a44; --text:#e6edf7; --muted:#8b9bb4;
  --green:#00d97e; --amber:#ffb020; --red:#ff4d4f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--dark);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:12px;max-width:520px;margin:0 auto;line-height:1.5;
}
.header{text-align:center;padding:14px 0 18px}
.header h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.score-ring{
  width:120px;height:120px;margin:16px auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:6px solid var(--border);position:relative;transition:border-color .4s
}
.score-ring .val{font-size:34px;font-weight:700;line-height:1}
.score-ring .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px;text-align:center
}
.card .num{font-size:24px;font-weight:700;line-height:1.1}
.card .cap{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.section{margin:18px 0 8px}
.section h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.feed{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.feed-item{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-item .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-top:6px;flex-shrink:0}
.feed-item .txt{flex:1;min-width:0}
.feed-item .time{font-size:10px;color:var(--muted);margin-top:2px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.status-row{display:flex;justify-content:space-between;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.status-row .lbl{font-size:13px}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.on{background:rgba(0,217,126,.15);color:var(--green)}
.badge.off{background:rgba(139,155,180,.15);color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;
  text-align:center;transition:all .2s
}
.btn:active{background:var(--border);transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--magenta));border:none;color:var(--dark);font-weight:700}
.footer{text-align:center;padding:20px 0 10px;font-size:11px;color:var(--muted)}
.refresh{position:fixed;bottom:16px;right:16px;background:var(--panel);
  border:1px solid var(--border);border-radius:50%;width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1>DANIELA OS</h1>
  <div class="sub">Pixel Second Screen</div>
</div>

<div class="score-ring" id="ring">
  <div class="val" id="score">—</div>
  <div class="lbl">Health Score</div>
</div>

<div class="grid">
  <div class="card">
    <div class="num" id="agents">—</div>
    <div class="cap">Agentes</div>
  </div>
  <div class="card">
    <div class="num" id="findings">—</div>
    <div class="cap">Findings</div>
  </div>
</div>

<div class="section">
  <h2>Estado del Pixel</h2>
  <div class="status-row">
    <span class="lbl">Conexión</span>
    <span class="badge off" id="connBadge">Offline</span>
  </div>
  <div class="status-row">
    <span class="lbl">Batería</span>
    <span class="badge off" id="batBadge">—</span>
  </div>
</div>

<div class="section">
  <h2>Actividad reciente</h2>
  <div class="feed" id="feed">
    <div class="empty">Cargando actividad…</div>
  </div>
</div>

<div class="controls">
  <div class="btn primary" onclick="doAction('sync')">Sincronizar</div>
  <div class="btn" onclick="doAction('screenshot')">Screenshot</div>
  <div class="btn" onclick="doAction('speak')">Hablar</div>
  <div class="btn" onclick="doAction('discover')">Buscar Pixel</div>
</div>

<div class="footer" id="footer">Actualizando…</div>

<div class="refresh" onclick="loadData()">↻</div>

<script>
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts*1000);
  return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}

function setScore(v){
  const ring = document.getElementById('ring');
  const el = document.getElementById('score');
  el.textContent = v || '—';
  let color = 'var(--border)';
  if(v >= 70) color = 'var(--green)';
  else if(v >= 40) color = 'var(--amber)';
  else if(v > 0) color = 'var(--red)';
  ring.style.borderColor = color;
  el.style.color = v >= 70 ? 'var(--green)' : (v >= 40 ? 'var(--amber)' : 'var(--text)');
}

function loadData(){
  fetch('/api/pixel/dashboard/data')
    .then(r => r.json())
    .then(d => {
      setScore(d.health_score);
      document.getElementById('agents').textContent = d.agent_count ?? '—';
      document.getElementById('findings').textContent = d.open_findings ?? '—';

      const cb = document.getElementById('connBadge');
      if(d.pixel_online){ cb.textContent='Online'; cb.className='badge on'; }
      else { cb.textContent='Offline'; cb.className='badge off'; }

      const bb = document.getElementById('batBadge');
      if(d.battery_pct){
        bb.textContent = d.battery_pct + '%';
        bb.className = 'badge ' + (d.battery_pct > 20 ? 'on' : 'off');
      } else { bb.textContent = '—'; bb.className='badge off'; }

      const feed = document.getElementById('feed');
      if(d.activity && d.activity.length){
        feed.innerHTML = d.activity.map(a =>
          `<div class="feed-item">
             <div class="dot"></div>
             <div class="txt">
               <div>${escapeHtml(a.text||'')}</div>
               <div class="time">${fmtTime(a.time)}</div>
             </div>
           </div>`).join('');
      } else {
        feed.innerHTML = '<div class="empty">Sin actividad reciente</div>';
      }

      document.getElementById('footer').textContent =
        'Actualizado ' + new Date().toLocaleTimeString('es-ES');
    })
    .catch(e => {
      document.getElementById('footer').textContent = 'Error: ' + e.message;
    });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function doAction(name){
  const routes = {
    sync:'/api/pixel/files/sync',
    screenshot:'/api/pixel/adb/screenshot',
    speak:'/api/voice/speak',
    discover:'/api/pixel/discover'
  };
  const url = routes[name];
  if(!url) return;
  const body = name==='speak'
    ? JSON.stringify({text:'Hola Alejandro, soy Daniela desde tu Pixel'})
    : '{}';
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body})
    .then(()=>loadData())
    .catch(e=>alert('Error: '+e.message));
}

loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>
