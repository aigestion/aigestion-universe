[project]
name = "daniela-research"
version = "0.1.0"
description = "Research environments for Daniela OS (experiments, eval harnesses)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
ml = ["torch>=2.3.0", "transformers>=4.40.0", "datasets>=2.18.0"]
notebook = ["jupyter>=1.0.0", "ipywidgets>=8.1.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daniela_research"]
