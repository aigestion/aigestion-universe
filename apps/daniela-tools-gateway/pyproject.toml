[project]
name = "daniela-tools-gateway"
version = "0.1.0"
description = "BYOK tool/MCP unification gateway for Daniela OS - zero markup"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AIGESTION Team", email = "team@aigestion.net"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0", "mypy>=1.10.0"]
openai = ["openai>=1.35.0"]
anthropic = ["anthropic>=0.26.0"]
google = ["google-generativeai>=0.7.0"]
all = ["openai>=1.35.0", "anthropic>=0.26.0", "google-generativeai>=0.7.0"]

[project.scripts]
tools-gateway = "services.tools_gateway:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
